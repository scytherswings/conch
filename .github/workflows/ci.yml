name: ci

on:
  push:
    branches: ["main"]
  pull_request:

permissions:
  contents: read

env:
  golang-version: "1.26"
  node-version: "22"

jobs:
  conch:
    name: conch (Go)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: .
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version: ${{ env.golang-version }}
          cache: true
      - name: build
        run: go build ./...
      - name: vet
        run: go vet ./...
      - name: gofmt
        run: |
          unformatted="$(gofmt -l .)"
          if [ -n "$unformatted" ]; then
            echo "gofmt needs to be run:" 1>&2
            printf '%s\n' "$unformatted" 1>&2
            exit 1
          fi
      - name: validate example configs
        run: |
          go run ./cmd/conch validate --config deploy/config.example.host-a.yml
          go run ./cmd/conch validate --config deploy/config.example.host-b.yml
          go run ./cmd/conch validate --config examples/config.minimal.yml
      - name: test
        run: go test ./...

  arbiter:
    name: arbiter (Workers)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: arbiter
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.node-version }}
          cache: npm
          cache-dependency-path: arbiter/package-lock.json
      - name: install
        run: npm ci
      - name: test
        run: npm test

  docker:
    name: docker build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: build image
        run: docker build -t conch:ci .

  secrets:
    name: secret scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@ff98106e4c7b2bc287b24eaf42907196329070c7 # v2.3.9
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
