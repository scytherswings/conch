name: ci

on:
  push:
    branches: ["main"]
  pull_request:

permissions:
  contents: read

env:
  golang-version: "1.27"
  node-version: "22"

jobs:
  conch:
    name: conch (Go)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: .
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version: ${{ env.golang-version }}
          cache: true
      - name: build
        run: go build ./...
      - name: vet
        run: go vet ./...
      - name: gofmt
        run: |
          unformatted="$(gofmt -l .)"
          if [ -n "$unformatted" ]; then
            echo "gofmt needs to be run:" 1>&2
            printf '%s\n' "$unformatted" 1>&2
            exit 1
          fi
      - name: validate example configs
        run: |
          go run ./cmd/conch validate --config deploy/config.example.host-a.yml
          go run ./cmd/conch validate --config deploy/config.example.host-b.yml
          go run ./cmd/conch validate --config examples/config.minimal.yml
      - name: test
        run: go test ./...

  arbiter:
    name: arbiter (Workers)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: arbiter
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.node-version }}
          cache: npm
          cache-dependency-path: arbiter/package-lock.json
      - name: install
        run: npm ci
      - name: test
        run: npm test

  docker:
    name: docker build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: build image
        run: docker build -t conch:ci .

  secrets:
    name: secret scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
